name: Streamlit keep-alive

on:
  schedule:
    # Every 6 hours -- Streamlit Community Cloud sleeps an app after 12
    # hours with no traffic (24h Tue-Fri / 72h Sat-Mon per Streamlit's
    # current policy), so this leaves comfortable headroom while keeping
    # the worst-case "someone hits a sleep screen" window small.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Needed only by the heartbeat step below.
permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visit app (wake if asleep)
        run: node keepalive.js

      # GitHub disables scheduled workflows in repos with no commit
      # activity for 60 days -- silently. This heartbeat commit keeps the
      # schedule alive indefinitely, in case there's ever a long stretch
      # with no other pushes to this repo.
      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-keepalive-run
          if [[ -n "$(git status --porcelain .last-keepalive-run)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-keepalive-run
            git commit -m "chore: keep-alive heartbeat [skip ci]"
            git push
          fi
